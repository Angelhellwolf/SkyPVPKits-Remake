# SkyPVPKits 配置文件
# 作者: AngelHell

# 服务器状态设置
server:
  # 服务器是否度过安全期 (true=正常, false=困难阶段)
  safe_period: true
  # 联系QQ号
  contact_qq: "2076049239"

# 数据库设置
database:
  # 数据库类型 (sqlite/mysql)
  type: "sqlite"
  # SQLite文件路径 (相对于插件数据文件夹)
  sqlite_file: "database.db"
  
  # MySQL设置 (当type为mysql时使用)
  mysql:
    host: "localhost"
    port: 3306
    database: "skypvpkits"
    username: "root"
    password: "password"
    # 连接池设置
    max_connections: 10
    connection_timeout: 30

# 礼包设置
kits:
  # 天空礼包 (5个等级)
  sky:
    enabled: true
    display_name: "§b天空礼包"
    description:
      - "§7向往"
    icon: "DIAMOND_SWORD"
    levels: 5
    # 永久购买价格 (点券)
    permanent_prices: [1000, 1500, 2000, 2000, 2500]
    # 每个等级的折扣 (0.0 = 免费, 1.0 = 原价)
    level_discounts: [0.0, 1.0, 1.0, 1.0, 1.0]  # 等级1免费，其他正常价格
    # 是否支持点券购买
    support_points: true
    # 是否支持月付
    support_monthly: true

  # 火星礼包 (4个等级)
  mars:
    enabled: true
    display_name: "§c火星礼包"
